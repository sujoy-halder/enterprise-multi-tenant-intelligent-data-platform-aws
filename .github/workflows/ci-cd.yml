name: enterprise-data-platform

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

env:
  AWS_REGION: us-east-1
  PROJECT_NAME: enterprise-data-platform
  ENVIRONMENT: dev

permissions:
  contents: read
  id-token: write
  security-events: write

jobs:
  validate:
    name: Lint, unit tests, Terraform validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyyaml

      - name: Python compile and repository validation
        run: |
          python -m compileall docker spark airflow scripts tests metadata
          python scripts/validate_project.py

      - name: Unit tests
        run: pytest -q

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Terraform validate
        run: |
          cd terraform/environments/dev
          terraform init -backend=false
          terraform validate

  docker:
    name: Build and scan images
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f docker/api/Dockerfile -t enterprise-data-platform-api:${{ github.sha }} docker/api

      - name: Build consumer image
        run: docker build -f docker/consumer/Dockerfile -t enterprise-data-platform-kafka-consumer:${{ github.sha }} docker/consumer

      - name: Build dbt runner image
        run: docker build -f docker/dbt/Dockerfile -t enterprise-data-platform-dbt-runner:${{ github.sha }} .

      - name: Build Spark image
        run: docker build -f docker/spark/Dockerfile -t enterprise-data-platform-spark:${{ github.sha }} .

      - name: Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: enterprise-data-platform-api:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

  deploy-dev:
    name: Deploy dev
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main'
    environment: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        run: |
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${AWS_REGION}.amazonaws.com"

      - name: Build and push images
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
        run: |
          make docker-build ENV=dev AWS_ACCOUNT_ID="$AWS_ACCOUNT_ID"
          make docker-push ENV=dev AWS_ACCOUNT_ID="$AWS_ACCOUNT_ID"

      - name: Terraform plan
        run: |
          cd terraform/environments/dev
          terraform init
          terraform validate
          terraform plan -out=tfplan

      - name: Terraform apply
        run: |
          cd terraform/environments/dev
          terraform apply -auto-approve tfplan

      - name: Deploy Kubernetes manifests
        run: |
          aws eks update-kubeconfig --name enterprise-data-platform-dev --region "$AWS_REGION"
          kubectl apply -k kubernetes/overlays/dev

      - name: Run smoke tests
        run: python scripts/smoke_test.py --namespace data-platform --environment dev

  dbt-quality:
    name: dbt compile and quality gates
    runs-on: ubuntu-latest
    needs: deploy-dev
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt
        run: pip install dbt-core dbt-snowflake great-expectations

      - name: dbt compile and tests
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          SNOWFLAKE_ROLE: TRANSFORMER_ROLE
          SNOWFLAKE_DATABASE: ENTERPRISE_ANALYTICS
          SNOWFLAKE_WAREHOUSE: TRANSFORMING_WH
          SNOWFLAKE_SCHEMA: DBT
        run: |
          cd dbt
          dbt deps
          dbt compile --profiles-dir .
          dbt test --profiles-dir .
