[project]
name = "enterprise-data-platform"
version = "0.1.0"
description = "Deployment-ready enterprise multi-tenant intelligent data platform reference architecture on AWS."
requires-python = ">=3.11"
dependencies = [
  "boto3>=1.34.0",
  "confluent-kafka>=2.5.0",
  "fastapi>=0.111.0",
  "great-expectations>=0.18.0",
  "pydantic>=2.7.0",
  "pytest>=8.2.0",
  "pyyaml>=6.0.1",
  "requests>=2.32.0",
  "structlog>=24.2.0",
  "uvicorn>=0.30.0"
]

[tool.pytest.ini_options]
testpaths = ["tests", "spark/tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
