apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: data-platform-reader
  namespace: data-platform
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "configmaps", "services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: data-platform-workload-reader
  namespace: data-platform
subjects:
  - kind: ServiceAccount
    name: data-platform-workload
    namespace: data-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: data-platform-reader
