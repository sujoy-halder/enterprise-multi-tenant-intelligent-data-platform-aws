apiVersion: v1
kind: Service
metadata:
  name: enterprise-api
  namespace: data-platform
  labels:
    app.kubernetes.io/name: enterprise-api
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
  selector:
    app.kubernetes.io/name: enterprise-api
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: enterprise-api
  namespace: data-platform
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internal
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
spec:
  rules:
    - host: api.data-platform.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: enterprise-api
                port:
                  name: http
